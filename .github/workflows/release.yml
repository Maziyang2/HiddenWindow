name: Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.2.0 这样的 tag 时触发

jobs:
  build-and-release:
    runs-on: windows-latest   # 用 GitHub 的 Windows 虚拟机编译

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/HiddenWindow/HiddenWindow.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: src/HiddenWindow/bin/Release/net8.0-windows/win-x64/publish/HiddenWindow.exe
          generate_release_notes: true
