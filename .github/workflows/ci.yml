name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/HiddenWindow/HiddenWindow.csproj -c Release --nologo

      - name: Test
        run: dotnet test tests/HiddenWindow.Tests/HiddenWindow.Tests.csproj -c Release --nologo
